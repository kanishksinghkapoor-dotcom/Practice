<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>QR Code – D/2026/406333</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#f5f5f5; margin:0; }
    .card { background:#fff; border-radius:10px; padding:36px 40px; box-shadow:0 4px 24px rgba(0,0,0,0.1); text-align:center; max-width:360px; }
    h2 { font-size:1rem; color:#333; margin-bottom:4px; }
    p  { font-size:0.78rem; color:#888; margin-bottom:20px; }
    canvas { border:1px solid #eee; border-radius:6px; }
    table  { margin-top:20px; width:100%; border-collapse:collapse; font-size:0.82rem; }
    td     { padding:7px 10px; border-bottom:1px solid #f0f0f0; text-align:left; }
    td:first-child { color:#888; width:48%; }
    td:last-child  { font-weight:600; color:#222; }
    .label { font-size:0.72rem; color:#aaa; margin-top:14px; word-break:break-all; }
    .print-btn { margin-top:20px; background:#26a69a; color:#fff; border:none; border-radius:4px; padding:10px 24px; font-size:0.85rem; font-weight:700; cursor:pointer; }
    .print-btn:hover { background:#1e8e82; }
    @media print { .print-btn { display:none; } }
  </style>
</head>
<body>
  <div class="card">
    <h2>GOVERNMENT OF WEST BENGAL</h2>
    <p>Health &amp; Family Welfare Department — Certificate QR</p>
    <canvas id="qr"></canvas>
    <table>
      <tr><td>Name</td><td>PURNIMA KAPOOR</td></tr>
      <tr><td>Date Of Death</td><td>06/11/2026</td></tr>
      <tr><td>Gender</td><td>Female</td></tr>
      <tr><td>Certificate No</td><td>D/2026/406333</td></tr>
      <tr><td>Date Of Issue</td><td>06/11/2026</td></tr>
    </table>
    <p class="label">QR Payload: WB-CERT-D2026406333</p>
    <button class="print-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>
  <script>
    QRCode.toCanvas(document.getElementById('qr'), 'WB-CERT-D2026406333', {
      width: 220, margin: 2,
      color: { dark: '#1a1a1a', light: '#ffffff' }
    });
  </script>
</body>
</html>
